<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071a17">
  <title>三合大西瓜 · Triple Merge Lab</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="ambient ambient-a" aria-hidden="true"></div>
  <div class="ambient ambient-b" aria-hidden="true"></div>
  <div class="ambient ambient-c" aria-hidden="true"></div>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <span class="brand-fruit brand-fruit-a"></span>
          <span class="brand-fruit brand-fruit-b"></span>
          <span class="brand-fruit brand-fruit-c"></span>
          <b>3</b>
        </div>
        <div class="brand-copy">
          <span class="eyebrow">TRIPLE MERGE LAB</span>
          <h1>三合大西瓜</h1>
        </div>
      </div>

      <div class="top-actions">
        <button id="soundToggle" class="icon-button" type="button" aria-pressed="true" title="开关音效">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9.2h3.2L12 5.4v13.2L7.2 14.8H4z" fill="currentColor"/>
            <path d="M15.2 8.3a5 5 0 0 1 0 7.4M17.8 5.8a8.3 8.3 0 0 1 0 12.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <span class="button-label">音效开</span>
        </button>
        <button id="restartButton" class="ghost-button" type="button">重新开始</button>
      </div>
    </header>

    <main class="layout">
      <section class="game-column" aria-label="游戏区域">
        <div class="scorebar">
          <div class="score-block">
            <span>得分</span>
            <strong id="score">0</strong>
          </div>
          <div class="score-block score-block-best">
            <span>最高</span>
            <strong id="best">0</strong>
          </div>
          <div class="next-block">
            <span>下一个</span>
            <div class="next-pill">
              <i id="nextFruit" class="mini-fruit" aria-hidden="true"></i>
              <b id="nextName">小莓莓</b>
            </div>
          </div>
        </div>

        <div class="board-frame">
          <div class="board-stage" id="boardStage">
            <canvas id="gameCanvas" width="480" height="700" aria-label="三合大西瓜游戏，移动鼠标或方向键瞄准，点击或空格投放水果"></canvas>

            <div class="combo-badge" id="comboBadge" aria-live="polite">连锁 ×2</div>
            <div class="danger-pill" id="dangerPill" aria-live="polite">
              <span class="danger-dot"></span>
              <span id="dangerText">红线告急</span>
            </div>
            <div class="toast" id="toast" role="status"></div>

            <div class="game-over" id="gameOver" aria-hidden="true">
              <div class="game-over-card">
                <span class="over-kicker">ORCHARD OVERFLOW</span>
                <h2>果园满啦</h2>
                <p>本局得分</p>
                <strong id="finalScore">0</strong>
                <div class="final-best" id="finalBest">最高纪录 0</div>
                <button id="playAgain" class="primary-button" type="button">再来一局</button>
              </div>
            </div>
          </div>

          <div class="board-hints">
            <span><kbd>鼠标 / ← →</kbd> 移动</span>
            <span><kbd>点击 / 空格</kbd> 投放</span>
          </div>
        </div>
      </section>

      <aside class="side-column" aria-label="规则与合成路线">
        <section class="side-card rule-card">
          <span class="card-label">核心规则</span>
          <div class="rule-equation" aria-hidden="true">
            <div class="rule-triple">
              <span class="mini-fruit rule-fruit-1"></span>
              <span class="mini-fruit rule-fruit-2"></span>
              <span class="mini-fruit rule-fruit-3"></span>
              <b>×3</b>
            </div>
            <span class="rule-arrow">→</span>
            <span class="mini-fruit rule-fruit-next big"></span>
          </div>
          <h2>三个同类，才合成</h2>
          <p>不是两个。让 3 个相同水果碰在一起，它们会一起进化成下一阶。</p>
        </section>

        <section class="side-card chain-card">
          <div class="card-head">
            <span class="card-label">进化路线</span>
            <span class="small-chip">共 5 阶</span>
          </div>
          <div id="mergeLadder" class="merge-ladder"></div>
        </section>

        <section class="side-card tip-card">
          <span class="card-label">小贴士</span>
          <ul>
            <li>快速连续合成会叠加连锁倍率。</li>
            <li>水果越过红线约 2 秒就会结束。</li>
            <li>三颗大西瓜会触发「瓜王暴击」清场。</li>
          </ul>
        </section>
      </aside>
    </main>

    <footer class="footer">
      <span>3 个相同水果 → 1 个进化水果</span>
      <span class="footer-dot"></span>
      <span>物理引擎：Matter.js</span>
    </footer>
  </div>

  <script src="lib/matter.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
